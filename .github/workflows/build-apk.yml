name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.2.8.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.2.8.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.2.8-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.8
          name: ResellTracker v1.2.8 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.2.8 Release

            #### 📦 File inclusi:
            - **`resell-tracker-v1.2.8.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.2.8.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 🏷️ **Multi-Platform Fee Customization**: Nel form di inserimento inventario (`AddItemModal`), quando metti in vendita un capo su più piattaforme contemporaneamente, puoi specificare e personalizzare le commissioni (% e tariffa fissa €) in modo indipendente per ciascuna piattaforma selezionata (es. tariffa promozionale su eBay e standard su Vinted).
            - 💾 **Persistenza Completa SQLite**: Le commissioni personalizzate per ciascuna piattaforma vengono salvate in modo permanente nel database SQLite dell'articolo (`customFees`) e preservate nei backup e nel calcolo del profitto netto quando l'articolo viene venduto.
            - 🎨 **Pill Piattaforme Pulite & Moderne**: Rimossi i sottotitoli ingombranti (`0% fee venditore`, `~11.5% + 0.35€`) dai chip di selezione piattaforma, rendendoli pill orizzontali minimali ed eleganti con indicatore colorato e feedback tattile.
            - ⚠️ **Fix Validazione Nome Articolo**: Risolto il problema per cui premendo "Salva nell'inventario" con il nome vuoto non succedeva nulla. Ora viene mostrato un bordo rosso di evidenziazione immediata con avviso testuale ("Inserisci un nome per l'articolo").
            - ⚡ **Indicatore Commissioni Speciali in Inventario**: I badge delle piattaforme nell'inventario mostrano l'icona `⚡` se l'articolo ha commissioni personalizzate configurate.
            - 🛡️ **Firma Ufficiale Google Play**: Entrambi i binari sono firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.2.8.apk
            build-output/resell-tracker-v1.2.8.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
