name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        id: get_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v${VERSION}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v${VERSION}.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v${{ env.APP_VERSION }}-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ResellTracker v${{ env.APP_VERSION }} (US Platforms, Adaptive Fiscal & Multi-Currency)
          body: |
            ### 📱 ResellTracker v${{ env.APP_VERSION }} (Build ${{ env.APP_VERSION_CODE }}) - International Expansion Release

            #### 📦 File inclusi:
            - **`resell-tracker-v${{ env.APP_VERSION }}.aab`**: Android App Bundle firmato per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v${{ env.APP_VERSION }}.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 🇺🇸 **Piattaforme USA Leader**: Aggiunti Poshmark (commissione 20%) e Mercari (commissione 10% + $0.50).
            - 🌍 **Ordinamento Intelligente per Geolocalizzazione**: L'app ordina automaticamente le piattaforme in base al paese del dispositivo (USA, UK, Spagna, Francia, Italia, Globale).
            - 📊 **Monitoraggio Fiscale Adattivo**:
              - 🇺🇸 **USA**: Monitoraggio soglia federale IRS Form 1099-K ($5.000 lordi).
              - 🇬🇧 **UK**: Regolamentazione HMRC Side Hustle (£1.000 di Trading Allowance o 30 vendite).
              - 🇪🇺 **UE**: Direttiva DAC7 (€2.000 lordi o 30 vendite).
              - 🌐 **Altri paesi**: Disattivazione automatica del monitoraggio fiscale.
            - 💱 **Supporto Multivaluta**: Formattazione automatica dinamica o manuale ($ USD, € EUR, £ GBP) su tutta l'app.
            - ⚙️ **Nuove Impostazioni Utente**: Selettori dedicati per Regime Fiscale e Valuta Predefinita in Impostazioni.
            - 🔒 **Firma Ufficiale Google Play**: Binari firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v${{ env.APP_VERSION }}.apk
            build-output/resell-tracker-v${{ env.APP_VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
