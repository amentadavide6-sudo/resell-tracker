name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.3.10.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.3.10.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.3.10-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.10
          name: ResellTracker v1.3.10 (Live RevenueCat Billing & Google Play AAB)
          body: |
            ### 📱 ResellTracker v1.3.10 Release - Official Google Play Billing & RevenueCat Integration

            #### 📦 File inclusi:
            - **`resell-tracker-v1.3.10.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.3.10.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 💳 **Integrazione Google Play Billing Ufficiale**: collegata la chiave pubblica di produzione RevenueCat per la gestione acquisti in-app (Lifetime 5,99 € e Mensile 1,99 €).
            - 🧪 **Licence Testing con Carta Fittizia (0,00 €)**: i tester del gruppo `reselltracker-testers@googlegroups.com` possono collaudare l'acquisto Pro con il metodo di pagamento di test a costo zero.
            - 🛡️ **Rilevamento Intelligente Entitlement**: sblocco Pro difensivo automatico compatibile con tutti gli identificatori RevenueCat.
            - 🔒 **Firma Ufficiale Google Play**: Binari firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.3.10.apk
            build-output/resell-tracker-v1.3.10.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
