name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.3.5.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.3.5.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.3.5-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.5
          name: ResellTracker v1.3.5 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.3.5 Release - Confetti Cannon Celebration & UX Polish

            #### 📦 File inclusi:
            - **`resell-tracker-v1.3.5.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.3.5.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 🎉 **Confetti Cannon su Vendita**: animazione celebrativa festosa e gratificante di esattamente 2,4 secondi con 46 coriandoli colorati a 60 FPS che esplodono all'atto della conferma di vendita, senza bloccare i tocchi a schermo.
            - ⚠️ **Avviso Visibile Salva Articolo**: pop-up chiaro a schermo intero con auto-scroll e focus automatico sul campo titolo se vuoto.
            - 🔄 **Pulsante Dinamico Inventario Vuoto**: mostra "+ Aggiungi un altro articolo" per reseller che hanno già capi venduti o archiviati.
            - 🛡️ **Firma Ufficiale Google Play**: Entrambi i binari sono firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.3.5.apk
            build-output/resell-tracker-v1.3.5.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
