name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.3.1.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.3.1.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.3.1-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: ResellTracker v1.3.1 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.3.1 Release - Temi VIP Pro, Insight Aziendali & Badge Esclusivi

            #### 📦 File inclusi:
            - **`resell-tracker-v1.3.1.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.3.1.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 👑 **Gamification Pro Ottimizzata (Opzione A)**: Per gli utenti Pro l'esperienza XP diventa il motore fondamentale per sbloccare strumenti di business esclusivi e personalizzazione estetica.
            - 📊 **Insight Aziendali Riservati ai Pro**: Le analisi statistiche ad alto valore strategico (Il tuo Giorno d'Oro più redditizio, Velocità di rotazione capi in giorni con Fast Flips 48h, Tasso di liquidazione magazzino) sono riservate agli utenti Pro e si sbloccano salendo di livello (Livello 3, 5, 8). Per gli utenti gratuiti compare il lucchetto dorato con invito a passare a Pro.
            - 🎨 **Temi VIP & Personalizzazione Interfaccia (Passo 2)**: Nuova sezione in Impostazioni che permette agli utenti Pro di trasformare l'aspetto dell'app sbloccando i temi Oro Onyx Prestige (Liv. 4), Smeraldo Luxury (Liv. 6) e Viola Cyberpunk (Liv. 8).
            - ⭐ **Badge Pro Nelle Storie Instagram**: Chi ha Pro ottiene il badge scintillante "👑 Verified Pro Reseller" nelle card social per massimizzare il prestigio, mentre gli utenti free continuano a condividere storie con il badge community portando download all'app.
            - 🛡️ **Firma Ufficiale Google Play**: Entrambi i binari sono firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.3.1.apk
            build-output/resell-tracker-v1.3.1.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
