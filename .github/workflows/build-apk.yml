name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.2.1.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.2.1-apk
          path: build-output/resell-tracker-v1.2.1.apk
          retention-days: 30

      - name: 🚀 Release APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: ResellTracker v1.2.1
          body: |
            ### 📱 ResellTracker v1.2.1 Release

            #### Novità e Migliorie:
            - 🌍 **Traduzione 100% Completa**: Italiano, Inglese, Francese, Spagnolo e Tedesco in tutta l'app (inclusi grafici, FAQ, banner e tutti i 10 ranghi di carriera).
            - 🚚 **Preset Corriere condizionali**: Mostrati solo in lingua Italiana (InPost, Poste Delivery, ecc.); campo diretto e pulito per utenti esteri.
            - 🗑️ **Eliminazione Canali Personalizzati**: Rimuovi piattaforme create dall'elenco tenendo premuto il pulsante o toccando l'icona cestino dedicata con popup di conferma.
            - 📐 **Fix Layout Pulsanti**: I pulsanti Backup e Ripristino sono ora disposti in colonna a larghezza intera per evitare qualsiasi troncamento o sovrapposizione in francese/tedesco.
          files: build-output/resell-tracker-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
