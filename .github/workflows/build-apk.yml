name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.3.6.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.3.6.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.3.6-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.6
          name: ResellTracker v1.3.6 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.3.6 Release - Deep Code Audit & Precision Polish

            #### 📦 File inclusi:
            - **`resell-tracker-v1.3.6.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.3.6.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni dell'Audit Approfondito:
            - 🛠️ **Piattaforme Personalizzate a 360°**: risolto il fallback su Vinted; le piattaforme create dall'utente (con percentuali e commissioni fisse dedicate) ora vengono riconosciute con il loro nome e colore effettivo in MarkSoldModal, Delist Assistant, Registro CSV e Social Proof.
            - 📊 **KPI Inventario Omnipresenti**: i contatori di capi attivi, capitale fermo e profitto atteso rimangono accurati e visibili anche quando si filtrano i capi per "Venduti" o "Bozze".
            - 🌍 **Localizzazione Dinamica del Grafico Storico**: i nomi dei mesi e le date nel grafico interattivo delle vendite si traducono automaticamente nella lingua attiva (Italiano, Inglese, Spagnolo, Francese, Tedesco).
            - 🛡️ **Defensive Math & Data Integrity**: aggiunta protezione contro valori non numerici in formatEuro e gestione di sicurezza per vendite parziali esaurite.
            - 🛡️ **Firma Ufficiale Google Play**: Entrambi i binari sono firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.3.6.apk
            build-output/resell-tracker-v1.3.6.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
