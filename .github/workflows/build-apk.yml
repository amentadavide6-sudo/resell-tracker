name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.2.3.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.2.3.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.2.3-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: ResellTracker v1.2.3 (APK + Google Play AAB Bundle - In-App Billing Ready)
          body: |
            ### 📱 ResellTracker v1.2.3 Release (Produzione & Google Play Ready)

            #### 📦 File inclusi:
            - **`resell-tracker-v1.2.3.aab`**: Android App Bundle per **Google Play Console** (Test Interno, Test Chiuso, Produzione) con supporto nativo agli acquisti in-app (`BILLING`).
            - **`resell-tracker-v1.2.3.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità & Perfezionamenti:
            - 💳 **Google Play Billing & RevenueCat integrati**: Abbonamenti mensili e acquisto a vita (Lifetime) completamente cablati con gestione acquisti, ripristino (`Restore Purchases`) e permessi `BILLING` in `AndroidManifest`.
            - 🏷️ **Prezzi Unificati e Coerenti**: 5,99 € Lifetime (accesso a vita) e 1,99 € / mese in tutte le schermate, traduzioni e dialoghi (eliminato ogni vecchio residuo a 3,49 €).
            - 🌍 **Pro Modal 100% Multilingua**: Traduzione completa di tutti i testi, feature, bottoni e messaggi di conferma in Italiano, Inglese, Francese, Spagnolo e Tedesco.
            - 🛡️ **Supporto Sandbox / Offline**: Se non sono ancora configurati gli SKU reali su Play Console, l'app gestisce l'acquisto in modalità sicura di simulazione senza crash.
          files: |
            build-output/resell-tracker-v1.2.3.apk
            build-output/resell-tracker-v1.2.3.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
