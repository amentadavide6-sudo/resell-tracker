name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Configure Release Signing Keystore
        run: node scripts/setup-release-signing.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.2.7.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.2.7.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.2.7-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7
          name: ResellTracker v1.2.7 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.2.7 Release

            #### 📦 File inclusi:
            - **`resell-tracker-v1.2.7.aab`**: Android App Bundle per **Google Play Console** (Closed Testing & Produzione).
            - **`resell-tracker-v1.2.7.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità e Risoluzioni:
            - 🛠️ **Fix Ripristino Backup (Restore from Backup)**: Il tasto "Ripristina da Backup" ora apre direttamente il selettore documenti nativo del sistema operativo per selezionare il file `.json`, eliminando il pop-up intermediario che bloccava il tocco su Android.
            - 🔄 **Fix Chiusura Condivisione (Share Sheet Hang)**: Risolto il blocco su Android quando l'utente chiude la finestra di condivisione senza selezionare un'app: l'applicazione rimane sempre reattiva al 100%.
            - 🛡️ **Integrazione Piattaforme Personalizzate nel Backup**: Ora il backup include anche le piattaforme create dall'utente e le ripristina fedelmente.
            - ⚡ **Modifica Rapida Commissioni al Volo**: Nel Calcolatore è possibile personalizzare istantaneamente la percentuale di commissione (%) e la tariffa fissa (€) per qualsiasi piattaforma selezionata con pulsante "Ripristina standard".
            - 🛡️ **Firma Ufficiale Google Play**: Entrambi i binari sono firmati con il Keystore di produzione ufficiale.
          files: |
            build-output/resell-tracker-v1.2.7.apk
            build-output/resell-tracker-v1.2.7.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
