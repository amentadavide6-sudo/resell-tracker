name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB (Play Console)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK and AAB Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 🏷️ Collect Release Binaries
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/resell-tracker-v1.2.2.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/resell-tracker-v1.2.2.aab

      - name: 📤 Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resell-tracker-v1.2.2-binaries
          path: build-output/*
          retention-days: 30

      - name: 🚀 Release APK & AAB to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: ResellTracker v1.2.2 (APK + Google Play AAB Bundle)
          body: |
            ### 📱 ResellTracker v1.2.2 Release

            #### 📦 File inclusi:
            - **`resell-tracker-v1.2.2.aab`**: Android App Bundle per **Google Play Console** (Test Interno, Test Chiuso, Produzione).
            - **`resell-tracker-v1.2.2.apk`**: Pacchetto APK installabile direttamente su qualsiasi smartphone Android.

            #### 🚀 Novità & Perfezionamenti:
            - 🏆 **Roadmap 100% Tradotta**: Tradotta la ricompensa dei livelli (*"Sblocca +X ore di Pro Pass gratis"* / *"Unlock +Xh of Free Pro Pass"*) e l'intestazione Reseller Club in tutte le lingue (IT, EN, FR, ES, DE).
            - 🗑️ **Eliminazione Piattaforme Personalizzate Risolta al 100%**: Rimosso qualsiasi conflitto o errore di eventi touch; ora l'icona del cestino rossa dedicata sul chip e la pressione prolungata (long-press) eliminano la piattaforma all'istante con finestra modale di conferma e refresh immediato dell'interfaccia.
            - 🌍 **Preset Corriere Condizionali**: Attivi esclusivamente in lingua Italiana (`it`); interfaccia pulita e campo diretto per tutte le altre lingue.
            - 📐 **Fix Layout & Anti-Overflow**: Bottoni di Backup e Ripristino a larghezza intera in colonna, impeccabili anche per i testi più lunghi.
          files: |
            build-output/resell-tracker-v1.2.2.apk
            build-output/resell-tracker-v1.2.2.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
